version: "3.9"

# ============================================================
# image-service — standalone docker-compose
#
# Run:  docker-compose up --build
# Test: curl http://localhost:8001/health
#       curl -X POST http://localhost:8001/run
# ============================================================

services:
  image-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: image-service:latest
    container_name: image-service
    ports:
      - "8002:8002"
    environment:
      # Override any env-file values here if needed
      - PYTHONPATH=/app
    volumes:
      # Mount local image folder into the container at runtime
      - ./data/post_images:/app/data/post_images:ro
      # Mount outputs so CSV files are written to the host
      - ./outputs:/app/outputs
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
